[project]
name = "stpp"
version = "0.1.0"
description = "Neural detection of localized regime shifts in self-exciting space-time point processes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    # Needed by Quarto to run Python cells (directly or through R's reticulate)
    "jupyter",
    "ipykernel",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stpp"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
